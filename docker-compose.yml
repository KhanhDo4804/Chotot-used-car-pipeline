services:
  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    image: chotot-dbt:local
    working_dir: /usr/app/dbt
    env_file:
      - .env
    volumes:
      - ./dbt:/usr/app/dbt
      - ./secrets:/usr/app/secrets:ro
    command: ["dbt", "debug", "--profiles-dir", "."]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: chotot-airflow:local
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/dbt_snowflake_key.p8
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./dbt:/opt/airflow/project/dbt
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    image: chotot-airflow:local
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/dbt_snowflake_key.p8
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    image: chotot-airflow:local
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/dbt_snowflake_key.p8
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: scheduler
    restart: unless-stopped

volumes:
  airflow_postgres_data:
  airflow_logs:
